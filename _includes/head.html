<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.data.course.number }}: {{ site.data.course.name }} | {{ site.data.course.university }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

{%- comment -%}
  Mark the document as JS-capable before first paint. The reveal-on-scroll
  animation is scoped to `.js`, so if this never runs (JS off, script blocked)
  the content simply renders visible instead of staying at opacity:0.
{%- endcomment -%}
<script>document.documentElement.className += ' js';</script>

<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if page.stylesheet %}
<link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
{% endif %}
