{% assign nav = site.data.navigation %}
<nav class="site-nav">
  <div class="container site-nav__inner">
    <a class="site-nav__brand" href="{{ '/index.html' | relative_url }}">{{ site.data.course.number }}</a>

    <button class="site-nav__toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <ul class="site-nav__links" id="nav-links">
      {% for item in nav %}
      <li>
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url %}class="is-active" aria-current="page"{% endif %}>
          {{ item.label }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</nav>
