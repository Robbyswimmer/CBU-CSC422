# Jekyll configuration — CSCI 4220 course site
#
# Everything the pages display comes from _data/*.yml. To change course
# content you should not need to open an HTML file.

title: "CSCI 4220: Machine and Deep Learning"
description: "Unlock the Power of AI and Transform Data into Intelligence"

# Published at https://robbyswimmer.github.io/CBU-CSC422/
# baseurl must match the repository name or every asset 404s.
baseurl: "/CBU-CSC422"
url: "https://robbyswimmer.github.io"
repository: "Robbyswimmer/CBU-CSC422"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Keep the syllabus PDF, assets/art images and the notebooks under
# FA26/ — they are linked from the site. Only the raw datasets are
# excluded; they are large and regenerable.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - data
  - "FA26/week11/materials/data"

# NOTE: default permalinks on purpose. Existing links and bookmarks point at
# /assignments.html etc.; switching to pretty URLs would break them.
