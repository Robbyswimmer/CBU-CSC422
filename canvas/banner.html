<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSCI 4220 · Machine &amp; Deep Learning</title>
<style>
  :root { --ink:#eef0ff; --dim:#aab0e6; --faint:#6f76b8; --accent:#7de2ff; --bar:#8fa2ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  .banner { position: relative; height: 100%; min-height: 240px; border-radius: 16px; overflow: hidden;
    background: radial-gradient(120% 140% at 85% 30%, #2d2170 0%, #151a45 45%, #0b0e28 100%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .copy { position: relative; z-index: 2; padding: 26px 30px; max-width: 60%; }
  .eyebrow { font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em;
    text-transform: uppercase; color: var(--accent); }
  h1 { margin: 10px 0 8px; font-size: clamp(24px, 3.4vw, 38px); line-height: 1.05; letter-spacing: -.02em;
    cursor: default; user-select: none; }
  .tag { margin: 0; min-height: 2.6em; color: var(--dim); font-size: 15px; line-height: 1.35; transition: opacity .35s; }
  .tag.fade { opacity: 0; }
  .train { margin-top: 16px; display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap;
    font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em;
    text-transform: uppercase; color: var(--faint); }
  .train b { display: block; margin-top: 4px; font-size: 18px; color: var(--ink); letter-spacing: 0; }
  .progress { width: 160px; }
  .progress i { display: block; height: 6px; margin-top: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
  .progress i::after { content: ""; display: block; height: 100%; width: var(--p, 0%); border-radius: 99px;
    background: linear-gradient(90deg, var(--bar), var(--accent)); }
  .toast { position: absolute; left: 50%; top: 16px; z-index: 6; transform: translate(-50%, -140%);
    padding: 10px 16px; border-radius: 999px; font: 700 13px/1 ui-sans-serif, system-ui; white-space: nowrap;
    background: #fff; color: #140c33; opacity: 0; visibility: hidden;
    transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .25s, visibility 0s .45s; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible;
    transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .15s; }

  /* ── brain rot mode ─────────────────────────────────────────────────────────────
     Loud on purpose, but never a strobe: nothing flashes faster than ~1 per second
     (WCAG 2.3.1 caps it at 3). All of it switches off for prefers-reduced-motion. */
  .brainrot { --ink:#fff; --dim:#fff; --faint:#ffffffb3; --accent:#b6ff00; --bar:#ff2fd0; }
  .brainrot .banner { background: linear-gradient(120deg, #ff2fd0, #7b2cff, #00c2ff, #b6ff00, #ff2fd0);
    background-size: 400% 400%; animation: drip 4s ease infinite; }
  @keyframes drip { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .brainrot .copy { margin: 12px; padding: 16px 20px; border-radius: 14px; background: rgba(18, 4, 44, .66); max-width: 53%; }
  .brainrot h1 { display: inline-block; transform-origin: 20% 60%;
    background: linear-gradient(90deg, #ff2fd0, #ffe600, #00e5ff, #b6ff00, #ff2fd0); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 2.2s linear infinite, wobble 1.1s ease-in-out infinite; }
  @keyframes rainbow { to { background-position: 300% 0; } }
  @keyframes wobble { 0%,100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(3deg) scale(1.07); } }
  .brainrot .tag { font-weight: 800; animation: jitter .16s steps(2) infinite; }
  @keyframes jitter { 0% { transform: translate(0,0); } 50% { transform: translate(1px,-1px); } 100% { transform: translate(-1px,1px); } }
  .brainrot .train b { animation: bump .5s ease-in-out infinite alternate; display: inline-block; }
  @keyframes bump { to { transform: scale(1.18) rotate(-4deg); } }
  .shake { animation: shake .55s cubic-bezier(.36,.07,.19,.97) both !important; }
  @keyframes shake { 10%,90%{transform:translate(-2px,1px) rotate(-.4deg)} 20%,80%{transform:translate(4px,-2px) rotate(.7deg)}
    30%,50%,70%{transform:translate(-8px,3px) rotate(-1.2deg)} 40%,60%{transform:translate(8px,-3px) rotate(1.2deg)} }
  .boom #net { animation: boom .7s cubic-bezier(.2,1.5,.4,1); }
  @keyframes boom { 0%{transform:scale(1)} 18%{transform:scale(1.45) rotate(3deg)} 100%{transform:scale(1)} }
  .fried { filter: saturate(2.6) contrast(1.3) brightness(1.05); }
  .pop { position: absolute; z-index: 5; pointer-events: none; white-space: nowrap;
    font: 900 34px/1 Impact, "Arial Black", "Helvetica Neue", sans-serif; color: #fff;
    -webkit-text-stroke: 2px #000; text-shadow: 3px 3px 0 #000;
    animation: pop 1.4s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes pop { 0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r)); opacity:0}
    22%{transform:translate(-50%,-50%) scale(1.3) rotate(var(--r)); opacity:1}
    70%{transform:translate(-50%,-50%) scale(1) rotate(var(--r)); opacity:1}
    100%{transform:translate(-50%,-70%) scale(1.5) rotate(var(--r)); opacity:0} }
  .fly { position: absolute; left: 0; z-index: 3; font-size: 30px; pointer-events: none; animation: fly linear forwards; }
  @keyframes fly { from { transform: translateX(-60px) rotate(0); } to { transform: translateX(var(--w)) rotate(900deg); } }
  .rain { position: absolute; top: -40px; z-index: 4; font-size: 28px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(330px) rotate(var(--r)); opacity: .2; } }
  .dvd { position: absolute; left: 0; top: 0; z-index: 4; font-size: 46px; pointer-events: none; will-change: transform; }

  @media (max-width: 640px) { .copy { max-width: 100%; padding: 20px; } .brainrot .copy { max-width: 100%; } .progress { width: 120px; } }
  @media (prefers-reduced-motion: reduce) {
    .brainrot .banner, .brainrot h1, .brainrot .tag, .brainrot .train b { animation: none; }
    .pop, .fly, .rain, .dvd { display: none; }
  }
</style>
</head>
<body>
<main class="banner" id="banner" aria-label="CSCI 4220 course banner">
  <canvas id="net" aria-hidden="true"></canvas>
  <div class="copy">
    <div class="eyebrow" id="eyebrow">CSCI 4220 · Fall 2026 · CBU</div>
    <h1 id="title">Machine &amp; Deep Learning</h1>
    <p class="tag" id="tag" aria-live="polite"></p>
    <div class="train">
      <div class="progress"><span id="k1">Epoch</span><b id="epoch">1 / 15</b><i id="bar"></i></div>
      <div><span id="k2">Training loss</span><b id="loss">—</b></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script src="brainrot.js"></script>
<script>
(function () {
  // ── the semester as a training run: week = epoch ──────────────────────────────
  var START = new Date(2026, 8, 7), WEEKS = 15;          // week 1 = Mon 7 Sep 2026
  var week = Math.max(1, Math.min(WEEKS, Math.floor((Date.now() - START) / 6048e5) + 1));
  var loss = (2.2 * Math.exp(-week / 4.5) + 0.08).toFixed(2);
  var aura = week * 1000;

  var COPY = {
    normal: {
      eyebrow: "CSCI 4220 · Fall 2026 · CBU", title: "Machine &amp; Deep Learning",
      k1: "Epoch", k2: "Training loss",
      tags: ["Training in progress. Loss decreasing.",
             "Every network is built out of corners.",
             "Gradient descent: a small step downhill, then repeat.",
             "Robby's energy at midnight: 1.6. Model converged.",
             "Universal approximation: enough hidden units, any shape.",
             "Rule one: the test set is looked at exactly once."]
    },
    rot: {
      eyebrow: "CSCI 4220 · no cap · fall 2026", title: "Machine &amp; Deep Brainrot 🧠",
      k1: "Grindset epoch", k2: "Aura",
      tags: ["gradient descent = rolling downhill one smol step at a time fr fr",
             "ReLU said no negativity allowed 💅 negatives → 0",
             "overfitting = memorized the answer key, zero aura on the real test",
             "a shallow network can rizz up ANY function. it's literally a theorem",
             "learning rate too big? you're cooked 🔥",
             "backprop: the blame game, but make it calculus",
             "dropout = fanum tax on your neurons 🍟",
             "the test set is the final boss. one attempt. no peeking. no cap"]
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  var banner = $("banner"), calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var tagI = 0, tagTimer, fadeTimer;
  function currentTags() { return (BrainRot.on ? COPY.rot : COPY.normal).tags; }
  function showTag(now) {
    var el = $("tag");
    clearTimeout(fadeTimer);                 // a toggle mid-fade must not finish with the old mode's line
    if (now) { el.classList.remove("fade"); el.textContent = currentTags()[0]; return; }
    el.classList.add("fade");
    fadeTimer = setTimeout(function () {
      var tags = currentTags(); tagI = (tagI + 1) % tags.length; el.textContent = tags[tagI]; el.classList.remove("fade");
    }, 350);
  }
  function stats() { $("loss").textContent = BrainRot.on ? "+" + aura.toLocaleString() + " 🔥" : loss + " ↓"; }
  function render() {
    var c = BrainRot.on ? COPY.rot : COPY.normal;
    $("eyebrow").textContent = c.eyebrow; $("title").innerHTML = c.title;
    $("k1").textContent = c.k1; $("k2").textContent = c.k2; stats();
    $("epoch").textContent = week + " / " + WEEKS;
    $("bar").style.setProperty("--p", (100 * week / WEEKS) + "%");
    tagI = 0; showTag(true);
  }
  tagTimer = setInterval(function () { showTag(false); }, 4200);

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function add(cls, text, css, life) {
    var s = document.createElement("span"); s.className = cls; s.textContent = text;
    for (var k in css) s.style.setProperty(k, css[k]);
    banner.appendChild(s); setTimeout(function () { s.remove(); }, life);
    return s;
  }
  var EMO = ["🧠", "💀", "🔥", "🗿", "✨", "🥶", "💅", "🍟", "😭", "🤯"];
  var WORDS = ["SKIBIDI", "NO CAP", "+1000 AURA", "W", "SIGMA", "RIZZ", "OHIO", "FR FR", "COOKED", "GYM ARC",
               "ReLU RIZZ", "GRADIENT GRINDSET", "LOSS: 0", "EMOTIONAL DAMAGE", "BUSSIN"];
  var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  function rain() {
    for (var i = 0; i < 34; i++)
      add("rain", EMO[i % EMO.length], { left: (Math.random() * 100) + "%", "animation-duration": (1.1 + Math.random() * 1.2) + "s",
          "animation-delay": (Math.random() * .5) + "s", "--r": (Math.random() * 720 - 360) + "deg" }, 2600);
  }

  // ── the chaos loop: only runs while brain rot mode is on ─────────────────────
  var chaos = [], dvd = null, raf = null;
  function every(ms, f) { chaos.push(setInterval(f, ms)); }
  function pulse(cls, ms) { banner.classList.add(cls); setTimeout(function () { banner.classList.remove(cls); }, ms); }
  function startChaos() {
    if (calm || chaos.length) return;
    every(1100, function () {
      var w = pick(WORDS); aura += 1000; stats();
      add("pop", w, { left: (15 + Math.random() * 75) + "%", top: (20 + Math.random() * 65) + "%",
                      "--r": (Math.random() * 30 - 15) + "deg", color: pick(["#fff", "#ffe600", "#b6ff00", "#00e5ff"]) }, 1400);
    });
    every(520, function () {
      var d = 2.4 + Math.random() * 2.6;
      add("fly", pick(EMO), { top: (Math.random() * 82) + "%", "--w": (banner.clientWidth + 120) + "px",
                              "animation-duration": d + "s", "font-size": (22 + Math.random() * 26) + "px" }, d * 1000);
    });
    every(3700, function () { pulse("shake", 600); });
    every(5300, function () { pulse("boom", 750); });
    every(7100, function () { pulse("fried", 1100); });
    // a DVD-logo brain that bounces off the walls and changes colour on every hit
    dvd = add("dvd", "🧠", {}, 1e9);
    var x = 40, y = 30, vx = 2.6, vy = 2.1, hue = 0;
    (function bounce() {
      var W = banner.clientWidth - 52, H = banner.clientHeight - 52;
      x += vx; y += vy;
      if (x < 0 || x > W) { vx = -vx; x = Math.max(0, Math.min(W, x)); hit(); }
      if (y < 0 || y > H) { vy = -vy; y = Math.max(0, Math.min(H, y)); hit(); }
      dvd.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (x * 2) + "deg)";
      dvd.style.filter = "hue-rotate(" + hue + "deg) drop-shadow(0 0 10px #fff)";
      raf = requestAnimationFrame(bounce);
    })();
    function hit() {
      hue = (hue + 70) % 360;
      var cornered = (x < 4 || x > banner.clientWidth - 56) && (y < 4 || y > banner.clientHeight - 56);
      if (cornered) { aura += 10000; stats(); add("pop", "IT HIT THE CORNER", { left: "50%", top: "50%", "--r": "-6deg", color: "#ffe600" }, 1400); }
    }
  }
  function stopChaos() {
    chaos.forEach(clearInterval); chaos = []; cancelAnimationFrame(raf);
    ["shake", "boom", "fried"].forEach(function (c) { banner.classList.remove(c); });
    banner.querySelectorAll(".pop, .fly, .rain, .dvd").forEach(function (n) { n.remove(); });
  }

  BrainRot.onChange(function (on, how) {
    render();
    if (on) { startChaos(); if (how !== "sync" && !calm) { rain(); pulse("shake", 600); } }
    else stopChaos();
    if (how === "sync") return;
    toast(on ? "🧠 BRAIN ROT MODE ACTIVATED · same code again to touch grass" : "touched grass. welcome back.");
  });
  BrainRot.tapTarget($("title"));
  render(); if (BrainRot.on) startChaos();

  // ── the network: pulses flow left → right; neurons flash when a pulse lands ───
  var cv = $("net"), ctx = cv.getContext("2d"), W, H, nodes = [], edges = [], pulses = [], t0 = performance.now();
  var LAYERS = [3, 5, 6, 5, 2];
  function layout() {
    var dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nodes = []; edges = [];
    var x0 = W < 640 ? W * .08 : W * .57, x1 = W * .95;
    LAYERS.forEach(function (n, L) {
      var x = x0 + (x1 - x0) * L / (LAYERS.length - 1);
      for (var i = 0; i < n; i++) nodes.push({ L: L, x: x, y: H * (i + 1) / (n + 1), glow: 0, e: EMO[(L * 3 + i) % EMO.length] });
    });
    nodes.forEach(function (a, ia) { nodes.forEach(function (b, ib) { if (b.L === a.L + 1) edges.push([ia, ib]); }); });
  }
  function spawn() {
    var starts = edges.filter(function (e) { return nodes[e[0]].L === 0; });
    pulses.push({ e: starts[Math.floor(Math.random() * starts.length)], s: 0, hue: Math.random() * 360 });
  }
  function frame(now) {
    var rot = BrainRot.on && !calm, t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H); ctx.lineWidth = rot ? 1.4 : 1;
    edges.forEach(function (e) {
      var a = nodes[e[0]], b = nodes[e[1]];
      ctx.strokeStyle = rot ? "hsla(" + ((t * 90 + a.y + b.x) % 360) + ",100%,75%,.32)" : "rgba(160,172,255,.14)";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });
    if (!calm && Math.random() < (rot ? .35 : .08)) spawn();
    pulses = pulses.filter(function (p) {
      p.s += rot ? .04 : .016;
      var a = nodes[p.e[0]], b = nodes[p.e[1]];
      if (p.s >= 1) {
        b.glow = 1;
        var next = edges.filter(function (e) { return e[0] === p.e[1]; });
        if (next.length && Math.random() < .8) { p.e = next[Math.floor(Math.random() * next.length)]; p.s = 0; return true; }
        return false;
      }
      var x = a.x + (b.x - a.x) * p.s, y = a.y + (b.y - a.y) * p.s;
      ctx.fillStyle = rot ? "hsl(" + ((p.hue + t * 300) % 360) + ",100%,60%)" : "#7de2ff";
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = rot ? 16 : 12;
      ctx.beginPath(); ctx.arc(x, y, rot ? 4.2 : 2.6, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      return true;
    });
    nodes.forEach(function (n, i) {
      n.glow *= .93;
      if (BrainRot.on) {                           // emoji neurons that bob, spin and pulse
        var s = 20 + 14 * n.glow + (rot ? 5 * Math.sin(t * 7 + i) : 0);
        ctx.save(); ctx.translate(n.x, n.y + (rot ? Math.sin(t * 5 + n.x) * 6 : 0));
        if (rot) ctx.rotate(Math.sin(t * 3 + i) * .9 + (n.glow > .5 ? t * 6 : 0));
        ctx.font = s + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(n.e, 0, 0); ctx.restore();
      } else {
        ctx.fillStyle = "rgba(143,162,255," + (.55 + .45 * n.glow) + ")";
        ctx.shadowColor = "#8fa2ff"; ctx.shadowBlur = 6 + 18 * n.glow;
        ctx.beginPath(); ctx.arc(n.x, n.y, 5.5 + 2.5 * n.glow, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      }
    });
    requestAnimationFrame(frame);
  }
  addEventListener("resize", layout); layout(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
